<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello cube · Projection Lab</title>
    <style>html, body { margin: 0; height: 100%; background: #05050A; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
    <canvas id="view" aria-label="A rotating violet cube"></canvas>
    <script type="module">
        import { Game, Entity, Mesh, BasicMaterial, primitives } from "../engine/index.js";

        const game = new Game({ canvas: document.getElementById("view") });
        const cube = game.add(new Entity({ mesh: new Mesh(primitives.box(2, 2, 2), new BasicMaterial({ color: [0.6, 0.45, 1] })) }));
        game.onUpdate(() => cube.setRotationEuler(game.time * 0.7, 0, game.time));
        game.camera.distance = 7;
        game.start();
    </script>
</body>
</html>
