<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Picking · Projection Lab</title>
    <meta name="description" content="Ray casting: find the mesh and the exact point under the pointer, triangle-accurate.">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="example.css">
</head>
<body>
    <canvas id="view" aria-label="A field of boxes, balls, cones and rings; the one under the pointer lights up and a small marker sits where the pointer's ray meets it"></canvas>
    <div class="panel">
        <a class="back" href="./">Examples</a>
        <h1>Picking</h1>
        <p>Move the pointer over a shape: a ray from the camera finds the nearest triangle it crosses. Click to knock the shape over.</p>
        <div class="stats" id="stats" role="status">Nothing under the pointer</div>
    </div>
    <script type="module">
        import { Game, Entity, Mesh, StandardMaterial, ShadowMap, PostFX, Ease, primitives } from "../engine/index.js";
        import { orbit, ready, random } from "./shared.js";

        const game = new Game({ canvas: document.getElementById("view"), antialias: false });
        if (!game.failed) {
            const { scene, camera, renderer, input } = game;
            renderer.postfx = new PostFX(renderer, { ao: { enabled: true }, bloom: { threshold: 1.0, intensity: 0.7 }, vignette: 0.3 });
            scene.clearColor.set([0.1, 0.11, 0.16, 1]);
            scene.sunDirection.set([0.35, -0.5, 0.79]);
            scene.sunColor.set([1.0, 0.94, 0.86]);
            scene.skyColor.set([0.3, 0.34, 0.48]);
            scene.groundColor.set([0.14, 0.12, 0.12]);
            scene.fogColor.set([0.1, 0.11, 0.16]); scene.fogDensity = 0.012;
            scene.shadow = new ShadowMap({ center: [0, 0, 0], extent: [14, 14], depth: 50, size: 2048, strength: 0.75 });
            const floor = game.add(new Entity({ name: "floor", mesh: new Mesh(primitives.plane(60, 60), new StandardMaterial({ color: [0.3, 0.32, 0.4] })) }));

            const rand = random(3), shapes = [];
            const makers = [
                ["box", () => primitives.box(1.3, 1.3, 1.3), 0.65], ["ball", () => primitives.sphere(0.8, 28, 18), 0.8],
                ["cone", () => primitives.cone(0.8, 1.7, 28), 0.85], ["ring", () => primitives.torus(0.7, 0.26, 14, 36), 0.26],
                ["pillar", () => primitives.cylinder(0.5, 0.5, 2.2, 24), 1.1], ["capsule", () => primitives.capsule(0.45, 1.1), 1.0],
            ];
            const geometries = makers.map(([, make]) => make());
            for (let i = 0; i < 36; i++) {
                const k = Math.floor(rand() * makers.length), hue = rand();
                const color = [0.5 + 0.45 * Math.cos(hue * 6.28), 0.5 + 0.45 * Math.cos(hue * 6.28 + 2.1), 0.5 + 0.45 * Math.cos(hue * 6.28 + 4.2)];
                const e = game.add(new Entity({ name: makers[k][0], mesh: new Mesh(geometries[k], new StandardMaterial({ color, specular: 0.3, shininess: 30 })) }));
                e.setPosition(((i % 6) - 2.5) * 3.2 + (rand() - 0.5), (Math.floor(i / 6) - 2.5) * 3.2 + (rand() - 0.5), makers[k][2]);
                e.setYaw(rand() * 6.28);
                shapes.push(e);
            }
            // where the ray lands
            const marker = game.add(new Entity({ castShadow: false, visible: false, mesh: new Mesh(primitives.sphere(0.11, 12, 8), new StandardMaterial({ lit: false, color: [2.4, 1.9, 0.6], castShadow: false })) }));

            camera.distance = 26; camera.pitch = 0.75; camera.yaw = -1.9;
            orbit(game, { minDistance: 6, maxDistance: 60, minPitch: 0.1 });
            input.bind("select", ["Mouse0"]);

            const stats = document.getElementById("stats");
            let hovered = null, pressAt = null;
            const notMarker = (e) => e !== marker;
            game.onUpdate(() => {
                const p = input.pointer;
                // the same projection as the vertex shader, run backwards: a pixel becomes a ray from the eye
                const ray = camera.screenRay(p.x, p.y, renderer.canvas.clientWidth, renderer.canvas.clientHeight);
                const hit = scene.raycast(ray, { filter: notMarker })[0];
                const target = hit && hit.entity !== floor ? hit.entity : null;
                if (target !== hovered) {
                    if (hovered) hovered.mesh.material.emissive.set([0, 0, 0]);
                    hovered = target;
                    if (hovered) hovered.mesh.material.emissive.set(hovered.mesh.material.color.map((c) => c * 0.55));
                }
                marker.visible = !!hit;
                if (hit) {
                    marker.setPosition(hit.point[0], hit.point[1], hit.point[2]);
                    stats.textContent = `${hit.entity.name}\n${hit.distance.toFixed(2)} m from the camera\nat ${hit.point.map((v) => v.toFixed(1)).join(", ")}`;
                } else stats.textContent = "Nothing under the pointer";

                if (input.wasPressed("select")) pressAt = [p.x, p.y];
                if (input.wasReleased("select") && pressAt && Math.hypot(p.x - pressAt[0], p.y - pressAt[1]) < 6 && target && !target.busy) {
                    // hop and spin, then settle
                    const e = target, z = e.position[2], spin = { a: 0 };
                    e.busy = true;
                    game.tweens.to(spin, { a: 1 }, { duration: 0.9, ease: Ease.outCubic,
                        onUpdate: () => { e.position[2] = z + Math.sin(spin.a * Math.PI) * 1.6; e.setRotationEuler(spin.a * Math.PI * 2, 0, spin.a * Math.PI); },
                        onComplete: () => { e.position[2] = z; e.busy = false; } });
                }
            });
            game.start();
            ready(game, { shapes });
        }
    </script>
</body>
</html>
