<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom shader · Projection Lab</title>
    <meta name="description" content="A ShaderMaterial written against the engine's projection and lighting chunks: rolling water that takes the scene's sun, lamps, shadows and fog.">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="example.css">
</head>
<body>
    <canvas id="view" aria-label="Crates and a buoy bobbing on rolling blue water at dusk; a lamp on the buoy lights the waves around it"></canvas>
    <div class="panel">
        <a class="back" href="./">Examples</a>
        <h1>Custom shader</h1>
        <p>The water is 60 lines of your own GLSL. It calls projectLab() to reach the screen and labLight() to take the scene's sun, lamp, shadows and fog like any built-in material.</p>
        <label>Wave height <input type="range" id="height" min="0" max="1.2" step="0.02" value="0.5"></label>
        <label>Choppiness <input type="range" id="chop" min="0.5" max="3" step="0.05" value="1.4"></label>
    </div>
    <script type="module">
        import { Game, Entity, Mesh, ShaderMaterial, StandardMaterial, ShadowMap, PostFX, primitives, projectionChunk, lightingChunk } from "../engine/index.js";
        import { orbit, ready, random } from "./shared.js";

        // The same wave in GLSL (to move the vertices) and in JavaScript (to float things on it).
        const WAVES = [[0.9, 0.35, 0.33, 1.1], [-0.4, 0.92, 0.2, 1.7], [0.7, -0.7, 0.12, 2.6]];      // direction x, y, amplitude, frequency
        const waveHeight = (x, y, t, height, chop) => WAVES.reduce((sum, [dx, dy, a, f]) => sum + a * Math.sin((x * dx + y * dy) * f * chop * 0.35 + t * (1 + f * 0.5)), 0) * height;
        const glslWaves = WAVES.map(([dx, dy, a, f]) => `h += ${a.toFixed(3)} * sin(dot(p, vec2(${dx.toFixed(3)}, ${dy.toFixed(3)})) * ${f.toFixed(3)} * u_chop * 0.35 + u_time * ${(1 + f * 0.5).toFixed(3)});`).join("\n    ");

        const water = new ShaderMaterial({
            name: "water",
            uniforms: { u_height: 0.5, u_chop: 1.4, u_deep: new Float32Array([0.02, 0.16, 0.3]), u_shallow: new Float32Array([0.1, 0.5, 0.62]) },
            vertex: projectionChunk + /* glsl */ `
                attribute vec3 a_position;
                uniform mat4 u_model;
                uniform float u_time, u_height, u_chop;
                varying vec3 v_world;
                varying vec3 v_normal;
                float wave(vec2 p) {
                    float h = 0.0;
                    ${glslWaves}
                    return h * u_height;
                }
                void main() {
                    vec3 world = (u_model * vec4(a_position, 1.0)).xyz;
                    world.z += wave(world.xy);
                    // the normal from the slope between this point and two neighbours
                    float e = 0.15;
                    v_normal = normalize(vec3(wave(world.xy - vec2(e, 0.0)) - wave(world.xy + vec2(e, 0.0)), wave(world.xy - vec2(0.0, e)) - wave(world.xy + vec2(0.0, e)), 2.0 * e));
                    v_world = world;
                    gl_Position = projectLab(world);
                }`,
            fragment: lightingChunk + /* glsl */ `
                uniform vec3 u_deep, u_shallow;
                varying vec3 v_world;
                varying vec3 v_normal;
                void main() {
                    vec3 n = normalize(v_normal), view = normalize(u_camPos - v_world);
                    // water seen at a glancing angle mirrors the sky; seen from above it shows its own colour
                    float fresnel = pow(1.0 - max(dot(n, view), 0.0), 4.0);
                    vec3 color = mix(u_deep, u_shallow, clamp(v_world.z * 0.9 + 0.5, 0.0, 1.0)) * labLight(v_world, n);
                    color = mix(color, u_skyColor * 2.2, fresnel * 0.7);
                    vec3 halfway = normalize(view + u_sunDirection);
                    color += u_sunColor * pow(max(dot(n, halfway), 0.0), 320.0) * 1.3 * labShadow(v_world, n);
                    gl_FragColor = vec4(labFog(color, v_world), 1.0);
                }`,
        });

        const game = new Game({ canvas: document.getElementById("view"), antialias: false });
        if (!game.failed) {
            const { scene, camera, renderer } = game;
            renderer.postfx = new PostFX(renderer, { bloom: { threshold: 0.95, intensity: 0.8 }, vignette: 0.32 });
            const DUSK = [0.5, 0.42, 0.52];
            scene.clearColor.set([...DUSK, 1]);
            scene.sunDirection.set([-0.75, 0.35, 0.36].map((v) => v / Math.hypot(0.75, 0.35, 0.36)));
            scene.sunColor.set([1.15, 0.72, 0.45]);
            scene.skyColor.set([0.3, 0.3, 0.46]);
            scene.groundColor.set([0.05, 0.1, 0.16]);
            scene.fogColor.set(DUSK); scene.fogDensity = 0.016;
            scene.shadow = new ShadowMap({ center: [0, 0, 0], extent: [14, 14], depth: 60, size: 2048, strength: 0.6 });

            // a custom vertex shader moves the surface, so the mesh's own bounds no longer describe it: never cull it
            game.add(new Entity({ name: "sea", frustumCulled: false, castShadow: false, mesh: new Mesh(primitives.plane(160, 160, 200, 200), water) }));

            const rand = random(5), floaters = [];
            const wood = [[0.72, 0.5, 0.3], [0.6, 0.4, 0.26], [0.8, 0.6, 0.38]];
            for (let i = 0; i < 9; i++) {
                const s = 0.9 + rand() * 0.7, e = game.add(new Entity({ mesh: new Mesh(primitives.box(s, s, s), new StandardMaterial({ color: wood[i % 3] })) }));
                floaters.push({ entity: e, x: (rand() - 0.5) * 18, y: (rand() - 0.5) * 18, yaw: rand() * 6.28, lift: s * 0.15 });
            }
            const buoy = game.add(new Entity({ mesh: new Mesh(primitives.cylinder(0.25, 0.7, 1.6, 20), new StandardMaterial({ color: [0.9, 0.25, 0.2] })) }));
            const lamp = buoy.add(new Entity({ castShadow: false, mesh: new Mesh(primitives.sphere(0.2, 12, 8), new StandardMaterial({ lit: false, color: [3, 2.2, 0.9], castShadow: false })) }));
            lamp.setPosition(0, 0, 1.0);
            const light = { position: [0, 0, 2], color: [2.4, 1.7, 0.7], radius: 9 };
            scene.pointLights.push(light);
            floaters.push({ entity: buoy, x: 2.5, y: -1.5, yaw: 0, lift: 0.5, lamp: true });

            camera.distance = 22; camera.pitch = 0.3; camera.yaw = -0.9; camera.target.set([0, 0, 0.5]);
            orbit(game, { minDistance: 6, maxDistance: 60, minPitch: 0.08, spin: 0.05 });

            // u_time is the renderer's clock (real seconds), so the CPU copy of the wave must read the same one
            game.onRender(() => {
                const t = renderer.time, h = water.values.u_height, chop = water.values.u_chop, e = 0.4;
                for (const f of floaters) {
                    const z = waveHeight(f.x, f.y, t, h, chop);
                    // lean with the slope of the water underneath
                    const sx = (waveHeight(f.x + e, f.y, t, h, chop) - waveHeight(f.x - e, f.y, t, h, chop)) / (2 * e);
                    const sy = (waveHeight(f.x, f.y + e, t, h, chop) - waveHeight(f.x, f.y - e, t, h, chop)) / (2 * e);
                    f.entity.interpolate = false;
                    f.entity.setPosition(f.x, f.y, z + f.lift);
                    f.entity.setRotationEuler(Math.atan(sy), -Math.atan(sx), f.yaw);
                    if (f.lamp) light.position = [f.x, f.y, z + f.lift + 1.4];
                }
            });
            const $ = (id) => document.getElementById(id);
            $("height").addEventListener("input", (e) => { water.values.u_height = +e.target.value; });
            $("chop").addEventListener("input", (e) => { water.values.u_chop = +e.target.value; });
            game.start();
            ready(game, { water });
        }
    </script>
</body>
</html>
