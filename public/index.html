<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Walk 3D · projection_library</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: black;
            overflow: hidden;
            font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
            color: #cfd6e6;
        }

        #myBoard {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #hud {
            position: fixed;
            left: 12px;
            bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(15, 18, 28, 0.8);
            border: 1px solid #2a2f3b;
            pointer-events: none;
        }

        #hud b { color: #fff; }
        #info { color: #8fd0ff; margin-bottom: 4px; }
    </style>
</head>

<body>
    <canvas id="myBoard"></canvas>
    <div id="hud">
        <div id="info"></div>
        <b>Space</b> add a step · <b>Shift+Space</b> add 50<br>
        <b>Drag</b> rotate · <b>Wheel</b> zoom · <b>P / O</b> magnify<br>
        <b>A D W S</b> rotate · <b>I K J L</b> move · <b>V C</b> distance
    </div>
    <script type="module" src="Main.js"></script>
</body>

</html>
