<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engine tests · Projection Lab</title>
    <style>
        body { margin: 0; padding: 20px; background: #05050A; color: #E6E8F2; font: 14px/1.5 system-ui, sans-serif; }
        h1 { font-size: 18px; margin: 0 0 12px; }
        h2 { font-size: 16px; } .good { color: #6BFF9E; } .bad { color: #FF6B8A; }
        .row { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; padding: 4px 0; border-bottom: 1px solid #1B1F33; }
        .ok span:first-child { color: #6BFF9E; } .ko span:first-child { color: #FF6B8A; }
        .ms { color: #7C829C; font: 12px ui-monospace, monospace; }
        pre { grid-column: 2 / 4; margin: 4px 0 8px; padding: 8px; background: #140A12; color: #FFB3C1; white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Projection Lab · engine tests</h1>
    <div id="out">Running…</div>
    <script type="module">
        import { run } from "./runner.js";
        import "./engine.test.js";
        import "./lighting.test.js";
        run(document.getElementById("out"));
    </script>
</body>
</html>
